---
/configurations:
  get:
    x-mojo-to: Configurations#list
    operationId: listConfigurations
    tags:
      - configurations
    summary: List configurations
    produces:
      - application/json
    parameters:
      - name: name
        in: query
        description: Filter by configuration name
        required: false
        type: string
      - name: library_id
        in: query
        description: Filter by library ID
        required: false
        type: string
      - name: category_id
        in: query
        description: Filter by category ID
        required: false
        type: string
      - name: item_type
        in: query
        description: Filter by item type
        required: false
        type: string
      - name: configuration_group_bit
        in: query
        description: Filter by configuration group bit
        required: false
        type: integer
      - $ref: "../swagger.yaml#/parameters/match"
      - $ref: "../swagger.yaml#/parameters/order_by"
      - $ref: "../swagger.yaml#/parameters/page"
      - $ref: "../swagger.yaml#/parameters/per_page"
      - $ref: "../swagger.yaml#/parameters/q_param"
      - $ref: "../swagger.yaml#/parameters/q_body"
      - $ref: "../swagger.yaml#/parameters/request_id_header"
    responses:
      "200":
        description: A list of configurations
        schema:
          type: array
          items:
            $ref: "../swagger.yaml#/definitions/configuration"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

            * `invalid_query`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        parameters: manage_config
  post:
    x-mojo-to: Configurations#add
    operationId: addConfiguration
    tags:
      - configurations
    summary: Add configuration
    parameters:
      - name: body
        in: body
        description: A JSON object containing information about the new configuration
        required: true
        schema:
          $ref: "../swagger.yaml#/definitions/configuration"
    produces:
      - application/json
    responses:
      "201":
        description: Configuration added
        schema:
          $ref: "../swagger.yaml#/definitions/configuration"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        parameters: manage_config

"/configurations/{configuration_id}":
  get:
    x-mojo-to: Configurations#get
    operationId: getConfiguration
    tags:
      - configurations
    summary: Get configuration
    parameters:
      - name: configuration_id
        in: path
        description: Internal configuration identifier
        required: true
        type: integer
    produces:
      - application/json
    responses:
      "200":
        description: A configuration
        schema:
          $ref: "../swagger.yaml#/definitions/configuration"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Configuration not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        parameters: view_config
  put:
    x-mojo-to: Configurations#update
    operationId: updateConfiguration
    tags:
      - configurations
    summary: Update configuration
    parameters:
      - name: configuration_id
        in: path
        description: Internal configuration identifier
        required: true
        type: integer
      - name: body
        in: body
        description: A configuration object
        required: true
        schema:
          $ref: "../swagger.yaml#/definitions/configuration"
    produces:
      - application/json
    responses:
      "200":
        description: A configuration
        schema:
          $ref: "../swagger.yaml#/definitions/configuration"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Configuration not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: Internal error
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        parameters: manage_config
  delete:
    x-mojo-to: Configurations#delete
    operationId: deleteConfiguration
    tags:
      - configurations
    summary: Delete configuration
    parameters:
      - name: configuration_id
        in: path
        description: Internal configuration identifier
        required: true
        type: integer
    produces:
      - application/json
    responses:
      "204":
        description: Configuration deleted
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Configuration not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: Internal error
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        parameters: manage_config

"/configurations/group/{group_identifier}/settings":
  get:
    x-mojo-to: Configurations#group_setting_names
    operationId: listConfigurationNames
    tags:
      - configurations
    summary: List distinct configuration setting names for a specific group
    parameters:
      - name: group_identifier
        in: path
        description: Group identifier (either bit number or flag name)
        required: true
        type: string
    produces:
      - application/json
    responses:
      "200":
        description: An array of configuration names
        schema:
          type: array
          items:
            type: string
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Configuration group not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: Internal error
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        parameters: view_config

"/configurations/effective/{name}":
  get:
    x-mojo-to: Configurations#get_effective
    operationId: getEffectiveConfiguration
    tags:
      - configurations
    summary: Get the effective configuration for a specific context
    parameters:
      - name: name
        in: path
        description: Configuration setting name
        required: true
        type: string
      - name: library_id
        in: query
        description: Library ID for context
        required: false
        type: string
      - name: category_id
        in: query
        description: Category ID for context
        required: false
        type: string
      - name: item_type
        in: query
        description: Item type for context
        required: false
        type: string
      - name: with_metadata
        in: query
        description: Include metadata about the effective configuration
        required: false
        type: boolean
        default: false
    produces:
      - application/json
    responses:
      "200":
        description: The effective configuration value or object with metadata
        schema:
          type: object
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Configuration not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: Internal error
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        parameters: view_config
